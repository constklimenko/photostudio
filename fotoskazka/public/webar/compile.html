<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Компиляция таргета — WebAR prototype</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css?v=20261027">
  <style>
    [hidden] { display: none !important; }
    body { overflow: auto; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    progress { width: 100%; height: 14px; }
    #preview { max-width: 100%; max-height: 240px; display: block; margin: 8px 0; border-radius: 8px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    td { padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.12); }
    td:first-child { color: var(--dim); }
  </style>
</head>
<body>
  <main>
    <div class="title">Компиляция таргета в браузере <span class="dim">· D1.4 · MindAR</span></div>

    <div id="status" class="status">Выберите фото (JPEG/PNG). Компиляция идёт локально в браузере, файл никуда не отправляется.</div>

    <div class="hud-row">
      <input id="file" type="file" accept="image/jpeg,image/png">
      <label class="pill">макс. сторона
        <select id="max-side">
          <option value="1600" selected>1600 px</option>
          <option value="1000">1000 px</option>
          <option value="0">без уменьшения</option>
        </select>
      </label>
    </div>

    <div class="hud-row">
      <button id="btn-compile" class="btn primary" disabled>Компилировать</button>
      <a id="download" class="btn" hidden>Скачать .mind</a>
    </div>

    <progress id="progress" max="100" value="0"></progress>
    <img id="preview" alt="" hidden>

    <table id="result" hidden>
      <tbody></tbody>
    </table>
  </main>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="./compile.js?v=20261027"></script>
</body>
</html>
