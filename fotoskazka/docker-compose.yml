x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: fotoskazka-app:latest
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - ./:/var/www/html
    - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
  depends_on:
    db:
      condition: service_healthy
  networks:
    - fotoskazka

services:
  app:
    <<: *app
    environment:
      RUN_SETUP: "true"
    command: ["php-fpm"]

  queue:
    <<: *app
    environment:
      RUN_SETUP: "false"
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *app
    environment:
      RUN_SETUP: "false"
    command: ["php", "artisan", "schedule:work"]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - fotoskazka

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fotoskazka}
      MYSQL_USER: ${DB_USERNAME:-fotoskazka}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - fotoskazka

  node:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: ["sh", "-c", "npm ci && npm run build"]

networks:
  fotoskazka:
    driver: bridge

volumes:
  dbdata:
